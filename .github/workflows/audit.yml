name: Audit

# Advisories run separately from CI so a newly published advisory doesn't fail unrelated PRs. The
# weekly run surfaces it instead, and PRs that change dependencies are checked before merge. This
# isn't a required check.
on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: [Cargo.lock, deny.toml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    name: cargo deny advisories
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-deny
      - run: just audit
