name: CI

# Jobs only install the toolchain and tools, then run a recipe, so every check reproduces locally.
#
# Workflows may use only GitHub's own actions and an allowlist, each pinned to a full commit SHA
# with its version in a comment. Dependabot keeps the pins current. A new third-party action is
# justified like a dependency, and a human developer adds it under Settings → Actions → General
# first, or GitHub rejects the run.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its stale run. Each commit on main gets its own group, so its run
# always finishes and leaves a status and cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # The ruleset on main requires this job by name, on a branch up to date with main. Renaming it
    # blocks every merge until a human developer updates the ruleset, so a PR that renames it
    # says so.
    name: just ci
    # Draft PRs skip CI; marking a PR ready for review runs it.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest,cargo-deny
      - run: just ci
