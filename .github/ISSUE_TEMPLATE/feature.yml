name: Feature request
description: A new capability or an improvement
labels: ["kind/feature", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you've considered.
