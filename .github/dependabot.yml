version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait a week after each release, so a malicious release is likely caught and yanked first.
    # This doesn't limit what lands in Cargo.lock: a lockfile update can move to a newer compatible
    # release still inside the cooldown, while the PR names the version Dependabot chose
    # (https://github.com/dependabot/dependabot-core/issues/16428). Review the Cargo.lock diff.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels: [kind/chore]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels: [kind/chore]
    groups:
      github-actions:
        patterns: ["*"]
