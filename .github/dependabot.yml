version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Wait a week after each release, so a malicious release is likely caught and yanked first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels: [kind/chore]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels: [kind/chore]
    groups:
      github-actions:
        patterns: ["*"]
