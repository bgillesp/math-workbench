[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/bgillesp/math-workbench"
publish = false

[workspace.dependencies]
# Workspace crates
mw-math = { path = "crates/mw-math" }

# External crates
cargo_metadata = "0.23.1"
lexopt = "0.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny" # deny, not forbid: an FFI/GPU module can opt out locally, with justification
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
# Allows for noisy pedantic lints go here, each with a one-line reason.
