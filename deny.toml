# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
#
# `just deny` checks bans, licenses, and sources on every PR. `just audit` checks advisories, run
# by audit.yml weekly and on PRs that touch Cargo.lock, so a newly published advisory doesn't
# fail unrelated PRs.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # { id = "RUSTSEC-0000-0000", reason = "why it doesn't apply, and when to revisit" },
]

[licenses]
# Permissive licenses compatible with distributing an Apache-2.0 application. A new entry needs a
# reason in its PR.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Each entry needs a reason.
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
